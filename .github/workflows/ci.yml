name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Ruff, Mypy, Pytest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # --locked falla si uv.lock no coincide con pyproject.toml.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Los tests de integración usan testcontainers; el runner de GitHub ya trae Docker.
      - run: uv run pytest

  compose:
    name: Stack completo desde una base vacía
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      # --wait falla si algún healthcheck no llega a verde.
      - run: docker compose up -d --build --wait --wait-timeout 300
      - name: migrate terminó con éxito
        run: test "$(docker compose ps -a migrate --format '{{.ExitCode}}')" = "0"
      - name: Diagnóstico
        if: failure()
        run: docker compose ps -a && docker compose logs --tail 100
      - if: always()
        run: docker compose down -v

  dashboard:
    name: Dashboard (ESLint, Vitest, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run build
