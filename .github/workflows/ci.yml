name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Ruff, Mypy, Pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # Third-party action pinned by SHA: a tag can move, a commit cannot.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # --locked fails if uv.lock does not match pyproject.toml.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # The architecture rules of CLAUDE.md and ADR-0001, as import contracts (pyproject.toml).
      - run: uv run lint-imports
      # The integration tests use testcontainers; the GitHub runner already has Docker.
      # Includes the test that fails if docs/openapi.json is not up to date.
      - run: uv run pytest

  compose:
    name: Full stack from an empty database
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read  # to pull the base images from ghcr.io as an authenticated user
    steps:
      - uses: actions/checkout@v7
      # Anonymous pulls from the shared runners' IPs get ghcr.io 429s (Too Many Requests),
      # and compose resolves the backend's base image once per service it builds.
      - name: Log in to ghcr.io to pull base images
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # Third-party action pinned by SHA: a tag can move, a commit cannot.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          # Its own key: the backend job saves its own in parallel with the same lock.
          cache-suffix: compose
      - run: cp .env.example .env
      # The server overlay (VIG-42) must stay valid even though CI never deploys it.
      - name: docker-compose.prod.yml is valid
        run: WILLAY_HOSTNAME=willay.example.org docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
      # --wait fails if any healthcheck does not turn green.
      - run: docker compose up -d --build --wait --wait-timeout 300
      - name: migrate finished successfully
        run: test "$(docker compose ps -a migrate --format '{{.ExitCode}}')" = "0"
      - name: End-to-end smoke test (seed + 2 simulator steps)
        run: |
          make seed
          make simulate ARGS="--scenario normal --stations 2 --seed 1 --steps 2 --interval 1" | tee simulate.log
          # _format_tick marks any response other than 202 with "failed: {...}".
          ! grep -q 'failed:' simulate.log
      - uses: actions/setup-node@v7
        with:
          node-version-file: dashboard/.nvmrc
      # VIG-33: the main views at 360 px, in a real browser, against this stack and its seed.
      - name: Main views at 360 px (Playwright)
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Diagnostics
        if: failure()
        run: docker compose ps -a && docker compose logs --tail 100
      - if: always()
        run: docker compose down -v

  dashboard:
    name: Dashboard (ESLint, Vitest, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: dashboard/.nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run build
