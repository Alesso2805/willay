[alembic]
script_location = %(here)s/migrations
# Nombres ordenables: 0001_initial.py, 0002_...
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src
path_separator = os
# La URL no vive aquí: migrations/env.py la lee de VIGIA_MIGRATE_DATABASE_URL (rol vigia_owner).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
