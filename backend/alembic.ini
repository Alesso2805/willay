[alembic]
script_location = %(here)s/migrations
# Sortable names: 0001_schemas_and_privileges.py, 0002_core_tables.py, ...
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src
path_separator = os
# The URL is not stored here: migrations/env.py reads WILLAY_MIGRATE_DATABASE_URL (willay_owner role).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
