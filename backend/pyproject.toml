[project]
name = "willay"
version = "0.1.0"
description = "Willay: multi-tenant early warning system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx2>=2.13.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "structlog>=26.1.0",
    "tzdata>=2026.4",
    "uuid-utils>=1.0.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
# Station simulator (VIG-11): `uv run simulate --scenario rimac --seed 42`
simulate = "willay.ingestion.api.simulator_cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.31.3",
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "testcontainers[postgres]>=4.15.0",
    "time-machine>=3.5.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF",
    "ASYNC",  # typical asyncio mistakes
    "DTZ",    # datetimes without a time zone
    "TID",    # banned imports (see banned-api)
    "PT",     # pytest style
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# SPEC's engineering rules: time comes in only through the Clock protocol.
"datetime.datetime.now".msg = "Use willay.shared.clock.Clock; datetime.now() only lives in SystemClock."
"datetime.datetime.utcnow".msg = "Use willay.shared.clock.Clock."
"datetime.datetime.today".msg = "Use willay.shared.clock.Clock."
"time.time".msg = "Use willay.shared.clock.Clock (or time.monotonic to measure durations)."

[tool.ruff.lint.per-file-ignores]
"src/willay/shared/clock.py" = ["TID251"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests", "migrations"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a real Postgres via Docker (testcontainers)",
]

# SPEC's architecture rules (Engineering rules, ADR-0001), checked by `lint-imports` (make lint, CI).
[tool.importlinter]
root_package = "willay"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The domain imports neither FastAPI nor SQLAlchemy"
type = "forbidden"
source_modules = ["willay.*.domain"]
forbidden_modules = ["fastapi", "starlette", "sqlalchemy", "asyncpg"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Within a module, each layer only imports the layers below it"
type = "layers"
containers = [
    "willay.identity", "willay.ingestion", "willay.territory", "willay.rules",
    "willay.incidents", "willay.alerts", "willay.realtime",
]
layers = ["api", "infrastructure", "application", "domain"]

[[tool.importlinter.contracts]]
name = "No module's API reaches into another module's infrastructure"
type = "forbidden"
source_modules = ["willay.*.api"]
forbidden_modules = ["willay.*.infrastructure"]
allow_indirect_imports = true
# Its own infrastructure is fine; not every module's API uses it.
unmatched_ignore_imports_alerting = "none"
ignore_imports = [
    "willay.identity.api.** -> willay.identity.infrastructure.**",
    "willay.ingestion.api.** -> willay.ingestion.infrastructure.**",
    "willay.territory.api.** -> willay.territory.infrastructure.**",
    "willay.rules.api.** -> willay.rules.infrastructure.**",
    "willay.incidents.api.** -> willay.incidents.infrastructure.**",
    "willay.alerts.api.** -> willay.alerts.infrastructure.**",
    "willay.realtime.api.** -> willay.realtime.infrastructure.**",
]

[[tool.importlinter.contracts]]
name = "Alerts do not depend on rules: rules call alerts, never the other way round"
type = "forbidden"
source_modules = ["willay.alerts"]
forbidden_modules = ["willay.rules"]

[[tool.importlinter.contracts]]
name = "Workers never run inside the API process"
type = "forbidden"
source_modules = ["willay.api"]
forbidden_modules = ["willay.workers"]
