[project]
name = "vigia"
version = "0.1.0"
description = "Willay: multi-tenant early warning system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx2>=2.13.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "structlog>=26.1.0",
    "tzdata>=2026.4",
    "uuid-utils>=1.0.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
# Station simulator (VIG-11): `uv run simulate --scenario rimac --seed 42`
simulate = "vigia.ingestion.api.simulator_cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.31.3",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "testcontainers[postgres]>=4.15.0",
    "time-machine>=3.5.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF",
    "ASYNC",  # typical asyncio mistakes
    "DTZ",    # datetimes without a time zone
    "TID",    # banned imports (see banned-api)
    "PT",     # pytest style
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# CLAUDE.md rule: time comes in only through the Clock protocol.
"datetime.datetime.now".msg = "Use vigia.shared.clock.Clock; datetime.now() only lives in SystemClock."
"datetime.datetime.utcnow".msg = "Use vigia.shared.clock.Clock."
"datetime.datetime.today".msg = "Use vigia.shared.clock.Clock."
"time.time".msg = "Use vigia.shared.clock.Clock (or time.monotonic to measure durations)."

[tool.ruff.lint.per-file-ignores]
"src/vigia/shared/clock.py" = ["TID251"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests", "migrations"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a real Postgres via Docker (testcontainers)",
]
