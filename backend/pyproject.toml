[project]
name = "vigia"
version = "0.1.0"
description = "Vigía: sistema de alerta temprana multi-tenant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "structlog>=26.1.0",
    "uuid-utils>=1.0.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.31.3",
    "httpx2>=2.13.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "testcontainers[postgres]>=4.15.0",
    "time-machine>=3.5.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF",
    "ASYNC",  # errores típicos de asyncio
    "DTZ",    # datetimes sin zona horaria
    "TID",    # imports prohibidos (ver banned-api)
    "PT",     # estilo pytest
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Regla de CLAUDE.md: el tiempo entra solo por el protocolo Clock.
"datetime.datetime.now".msg = "Usa vigia.shared.clock.Clock; datetime.now() solo vive en SystemClock."
"datetime.datetime.utcnow".msg = "Usa vigia.shared.clock.Clock."
"datetime.datetime.today".msg = "Usa vigia.shared.clock.Clock."
"time.time".msg = "Usa vigia.shared.clock.Clock (o time.monotonic para medir duraciones)."

[tool.ruff.lint.per-file-ignores]
"src/vigia/shared/clock.py" = ["TID251"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests", "migrations"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: requiere Postgres real vía Docker (testcontainers)",
]
