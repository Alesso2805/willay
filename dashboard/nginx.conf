server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # SPA: any path that is not a file is resolved by the Angular router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html without caching so that a new deployment shows up on reload;
    # the bundles carry a hash in their name and can be cached for a long time.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
