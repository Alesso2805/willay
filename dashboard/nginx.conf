server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # SPA: cualquier ruta que no sea un archivo la resuelve el router de Angular.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html sin caché para que un despliegue nuevo se vea al recargar;
    # los bundles llevan hash en el nombre y pueden cachearse mucho tiempo.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
