@let chart = model();
@let W = width();
<figure>
  <svg
    [attr.viewBox]="'0 0 ' + W + ' ' + H"
    class="h-auto w-full"
    role="img"
    [attr.aria-labelledby]="id + '-title ' + id + '-desc'"
  >
    <title [id]="id + '-title'">Lecturas de {{ data().station_code ?? 'la estación' }}</title>
    <desc [id]="id + '-desc'">{{ chart.summary }}</desc>

    @for (tick of chart.yTicks; track tick.label) {
      <line [attr.x1]="M.left" [attr.x2]="W - M.right" [attr.y1]="tick.y" [attr.y2]="tick.y" class="stroke-slate-200" />
      <text [attr.x]="M.left - 6" [attr.y]="tick.y" text-anchor="end" dominant-baseline="middle" class="fill-slate-500 text-[11px]">
        {{ tick.label }}
      </text>
    }
    @for (tick of chart.xTicks; track tick.x) {
      <text [attr.x]="tick.x" [attr.y]="H - 8" text-anchor="middle" class="fill-slate-500 text-[11px]">
        {{ tick.label }}
      </text>
    }

    @for (mark of chart.marks; track mark.x) {
      <line [attr.x1]="mark.x" [attr.x2]="mark.x" [attr.y1]="M.top - 6" [attr.y2]="H - M.bottom" class="stroke-slate-500" stroke-dasharray="3 3" />
      <text [attr.x]="mark.x + (mark.anchor === 'end' ? -4 : 4)" [attr.y]="mark.labelY" [attr.text-anchor]="mark.anchor" class="fill-slate-700 text-[11px]">
        {{ mark.label }}
      </text>
    }

    @if (chart.threshold; as threshold) {
      <line [attr.x1]="M.left" [attr.x2]="W - M.right" [attr.y1]="threshold.y" [attr.y2]="threshold.y" class="stroke-red-700" stroke-width="1.5" stroke-dasharray="6 4" />
      <text [attr.x]="W - M.right" [attr.y]="threshold.y - 5" text-anchor="end" class="fill-red-800 text-[11px] font-medium">
        {{ threshold.label }}
      </text>
    }

    @for (path of chart.paths; track $index) {
      <path [attr.d]="path" fill="none" class="stroke-brand-700" stroke-width="2" stroke-linejoin="round" />
    }
    @for (dot of chart.dots; track $index) {
      <circle [attr.cx]="dot.x" [attr.cy]="dot.y" r="3" class="fill-brand-700" />
    }
  </svg>
  <figcaption class="mt-2 flex flex-wrap items-center justify-between gap-2 text-xs text-slate-500">
    <span>Valores en {{ data().unit ?? 'la unidad de la estación' }}; horas de {{ timezone() }}.</span>
    <button type="button" class="link-action text-xs" [attr.aria-expanded]="showTable()" [attr.aria-controls]="id + '-table'" (click)="toggleTable()">
      {{ showTable() ? 'Ocultar tabla' : 'Ver como tabla' }}
    </button>
  </figcaption>
</figure>

@if (showTable()) {
  <div [id]="id + '-table'" class="mt-3 max-h-64 overflow-auto rounded-md border border-slate-200">
    <table class="w-full text-left text-sm">
      <caption class="sr-only">{{ chart.summary }}</caption>
      <thead class="sticky top-0 bg-slate-50 text-xs text-slate-600">
        <tr>
          <th scope="col" class="px-3 py-2 font-medium">Hora</th>
          <th scope="col" class="px-3 py-2 text-right font-medium">Valor ({{ data().unit ?? '' }})</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100">
        @for (reading of data().readings; track reading.measured_at) {
          <tr>
            <td class="px-3 py-1.5 text-slate-700">{{ time(reading.measured_at) }}</td>
            <td class="px-3 py-1.5 text-right tabular-nums text-slate-900">{{ number(reading.value) }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}
