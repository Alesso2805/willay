<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Willay</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The SVG wherever the browser takes it; `sizes` keeps Chrome from preferring the .ico. -->
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script>
    // The theme before the app loads, so a dark screen never flashes white. The same
    // rule and storage key as ThemeService (src/app/theme/theme.ts), which takes over.
    try {
      var choice = localStorage.getItem('willay.theme');
      if (choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
