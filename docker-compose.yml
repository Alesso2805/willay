# Willay local stack. `make up` creates .env from .env.example if it is missing.
# On a server, docker-compose.prod.yml goes on top of it (see docs/runbooks/deploy.md).
# Startup order: postgres -> (keycloak, migrate) -> api, workers, dashboard.

name: willay

x-backend: &backend
  build: ./backend
  image: willay-backend:dev
  restart: unless-stopped
  environment: &backend-env
    WILLAY_DATABASE_URL: postgresql+asyncpg://willay_app:${WILLAY_APP_PASSWORD:?}@postgres:5432/willay
    WILLAY_LOG_LEVEL: ${WILLAY_LOG_LEVEL:-INFO}
  depends_on: &after-migrate
    migrate:
      condition: service_completed_successfully

x-worker-healthcheck: &worker-healthcheck
  interval: 10s
  timeout: 5s
  retries: 3
  start_period: 20s

services:
  postgres:
    image: timescale/timescaledb-ha:pg16-ts2.30
    restart: unless-stopped
    command: ["postgres", "-c", "timescaledb.telemetry_level=off"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      WILLAY_OWNER_PASSWORD: ${WILLAY_OWNER_PASSWORD:?}
      WILLAY_APP_PASSWORD: ${WILLAY_APP_PASSWORD:?}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
    volumes:
      - pgdata:/home/postgres/pgdata
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${WILLAY_PG_PORT:-5433}:5432"
    healthcheck:
      # -h 127.0.0.1: during the init the temporary server only listens on the socket,
      # so the healthcheck does not turn green before the databases and roles exist.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d willay"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:${WILLAY_KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # ${WILLAY_DEV_USER_PASSWORD} placeholder in realm-willay.json
      WILLAY_DEV_USER_PASSWORD: ${WILLAY_DEV_USER_PASSWORD:?}
      # ${WILLAY_DASHBOARD_URL}: where the dashboard may send users back after signing in or out.
      WILLAY_DASHBOARD_URL: http://localhost:${WILLAY_DASHBOARD_PORT:-4200}
      # ${WILLAY_DEMO_PASSWORD}: the public demo accounts' shared password (VIG-43).
      WILLAY_DEMO_PASSWORD: ${WILLAY_DEMO_PASSWORD:-${WILLAY_DEV_USER_PASSWORD:?}}
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
      - ./infra/keycloak/themes/willay:/opt/keycloak/themes/willay:ro
    ports:
      - "${WILLAY_KEYCLOAK_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl: a hand-written HTTP request to the management port.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  mailpit:
    image: axllent/mailpit:v1.31.2
    restart: unless-stopped
    ports:
      - "${WILLAY_MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build: ./backend
    image: willay-backend:dev
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      WILLAY_MIGRATE_DATABASE_URL: postgresql+asyncpg://willay_owner:${WILLAY_OWNER_PASSWORD:?}@postgres:5432/willay
      WILLAY_DATABASE_URL: postgresql+asyncpg://willay_app:${WILLAY_APP_PASSWORD:?}@postgres:5432/willay
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    command: ["uvicorn", "--factory", "willay.api.main:create_app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *backend-env
      # iss = public URL the browser uses to request the token; the JWKS goes over the internal network.
      WILLAY_OIDC_ISSUER: http://localhost:${WILLAY_KEYCLOAK_PORT:-8080}/realms/willay
      WILLAY_OIDC_JWKS_URL: http://keycloak:8080/realms/willay/protocol/openid-connect/certs
      WILLAY_OIDC_AUDIENCE: willay-api
      # To build the Telegram linking links (without it, the API answers 503).
      WILLAY_TELEGRAM_BOT_USERNAME: ${WILLAY_TELEGRAM_BOT_USERNAME:-}
      # Public demo (VIG-43): GET /v1/demo says whether it is on, POST starts the scenario.
      WILLAY_DEMO_MODE: ${WILLAY_DEMO_MODE:-false}
    ports:
      - "${WILLAY_API_PORT:-8000}:8000"
    depends_on:
      <<: *after-migrate
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker-evaluator:
    <<: *backend
    command: ["python", "-m", "willay.workers.evaluator"]
    healthcheck:
      <<: *worker-healthcheck
      test: ["CMD", "python", "-m", "willay.workers.healthcheck", "evaluator"]

  worker-silence:
    <<: *backend
    command: ["python", "-m", "willay.workers.silence"]
    healthcheck:
      <<: *worker-healthcheck
      test: ["CMD", "python", "-m", "willay.workers.healthcheck", "silence"]

  worker-dispatcher:
    <<: *backend
    command: ["python", "-m", "willay.workers.dispatcher"]
    environment:
      <<: *backend-env
      WILLAY_SMTP_HOST: mailpit
      WILLAY_SMTP_PORT: "1025"
      # Base of the confirmation links in the emails: the API as seen from the browser.
      WILLAY_PUBLIC_URL: http://localhost:${WILLAY_API_PORT:-8000}
      # Without a token (empty), Telegram alerts stay pending.
      WILLAY_TELEGRAM_BOT_TOKEN: ${WILLAY_TELEGRAM_BOT_TOKEN:-}
    healthcheck:
      <<: *worker-healthcheck
      test: ["CMD", "python", "-m", "willay.workers.healthcheck", "dispatcher"]

  worker-escalation:
    <<: *backend
    command: ["python", "-m", "willay.workers.escalation"]
    healthcheck:
      <<: *worker-healthcheck
      test: ["CMD", "python", "-m", "willay.workers.healthcheck", "escalation"]

  worker-telegram:
    <<: *backend
    command: ["python", "-m", "willay.workers.telegram"]
    environment:
      <<: *backend-env
      # Without a token (empty), the worker starts disabled and only sends heartbeats.
      WILLAY_TELEGRAM_BOT_TOKEN: ${WILLAY_TELEGRAM_BOT_TOKEN:-}
      WILLAY_TELEGRAM_BOT_USERNAME: ${WILLAY_TELEGRAM_BOT_USERNAME:-}
    healthcheck:
      <<: *worker-healthcheck
      test: ["CMD", "python", "-m", "willay.workers.healthcheck", "telegram"]

  # Public demo (VIG-43): only with COMPOSE_PROFILES=demo (make secrets DEMO=1 sets it), so a
  # normal deployment never hands the owner's credentials to a long-running process.
  worker-demo:
    <<: *backend
    profiles: ["demo"]
    command: ["python", "-m", "willay.workers.demo"]
    environment:
      <<: *backend-env
      WILLAY_DEMO_MODE: ${WILLAY_DEMO_MODE:-false}
      # Restoring the demo organization deletes incident events, append-only for willay_app.
      WILLAY_MIGRATE_DATABASE_URL: postgresql+asyncpg://willay_owner:${WILLAY_OWNER_PASSWORD:?}@postgres:5432/willay
    healthcheck:
      <<: *worker-healthcheck
      test: ["CMD", "python", "-m", "willay.workers.healthcheck", "demo"]

  dashboard:
    build: ./dashboard
    image: willay-dashboard:dev
    restart: unless-stopped
    environment:
      # Written into /config.json when the container starts (docker/40-willay-config.sh), so the
      # dashboard follows the ports in .env.
      WILLAY_API_URL: http://localhost:${WILLAY_API_PORT:-8000}
      WILLAY_OIDC_AUTHORITY: http://localhost:${WILLAY_KEYCLOAK_PORT:-8080}/realms/willay
      WILLAY_MAIL_URL: http://localhost:${WILLAY_MAILPIT_UI_PORT:-8025}
      # The public demo (VIG-43): the sign-in screen shows its accounts and shared password.
      WILLAY_DEMO_MODE: ${WILLAY_DEMO_MODE:-false}
      WILLAY_DEMO_PASSWORD: ${WILLAY_DEMO_PASSWORD:-}
    ports:
      - "${WILLAY_DASHBOARD_PORT:-4200}:80"
    depends_on: *after-migrate
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
